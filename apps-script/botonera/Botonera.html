<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --navy: #16244f;
      --tinta: #1b2433;
      --gris: #6b7486;
      --linea: #e3e7ef;
      --suave: #f6f8fc;
      --rojo: #c62828;
      --verde: #1f7a4d;
      --ambar: #8a5a00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: #fff;
      color: var(--tinta);
      font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    p { margin: 0; }
    .quien { margin-bottom: 10px; font-size: 12.5px; color: var(--gris); }
    .quien b { color: var(--tinta); }

    .pestana { padding: 12px; margin-bottom: 10px; border: 1px solid var(--linea); border-radius: 10px; background: var(--suave); }
    .pestana h2 { margin: 0 0 8px; font-size: 14px; }
    .zonas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .meta { margin-top: 8px; font-size: 12px; color: var(--gris); }
    .meta .alerta { color: var(--rojo); font-weight: 600; }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 9px;
      border: 1px solid var(--linea);
      background: #fff;
      color: var(--tinta);
      padding: 9px 12px;
      text-align: left;
    }
    button:hover:not(:disabled) { border-color: var(--navy); }
    button:focus-visible { outline: 2px solid #2f7cf6; outline-offset: 2px; }
    button:disabled { opacity: .45; cursor: default; }
    .zona b { display: block; font-size: 13.5px; }
    .zona small { color: var(--gris); }
    .zona .n { float: right; font-size: 16px; font-weight: 800; color: var(--navy); }
    .principal { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 700; text-align: center; }
    .peligro { color: var(--rojo); }
    .acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .grande { display: block; width: 100%; margin-bottom: 8px; padding: 12px 14px; }
    .grande b { display: block; font-size: 14px; }
    .grande small { color: var(--gris); }

    .caja { padding: 12px; border: 1px solid var(--linea); border-radius: 10px; }
    .caja h2 { margin: 0 0 6px; font-size: 15px; }
    .caja ul { margin: 6px 0; padding-left: 18px; }
    .aviso { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: #fff4e5; color: var(--ambar); font-size: 12.5px; }
    .ok { color: var(--verde); font-weight: 700; }
    .error { color: var(--rojo); font-weight: 600; }
    .tabla { max-height: 190px; overflow: auto; margin-top: 8px; border: 1px solid var(--linea); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 5px 8px; border-bottom: 1px solid var(--linea); text-align: left; white-space: nowrap; }
    th { position: sticky; top: 0; background: var(--suave); }
    .cargando { color: var(--gris); padding: 20px 0; text-align: center; }
  </style>
</head>
<body data-vista="<?= vista ?>">
  <div id="app"><p class="cargando">Cargando…</p></div>

  <script>
    const VISTA = document.body.dataset.vista;
    const ORDEN_ZONAS = ['CABA', 'Norte', 'Sur', 'Oeste'];
    const $app = document.getElementById('app');
    let estado = null;

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
    const fmt = n => Number(n || 0).toLocaleString('es-AR');

    // google.script.run con promesas
    function servidor(funcion, ...args) {
      return new Promise((ok, mal) => {
        google.script.run.withSuccessHandler(ok).withFailureHandler(mal)[funcion](...args);
      });
    }

    function mostrar(html) { $app.innerHTML = html; }
    function trabajando(texto) { mostrar(`<p class="cargando">${esc(texto)}</p>`); }
    function fallo(err) {
      mostrar(`<div class="caja"><p class="error">No se pudo: ${esc((err && err.message) || err)}</p>
        <div class="acciones"><button type="button" data-volver>Volver</button></div></div>`);
    }

    /* ---------- 📞 Citar por zona ---------- */

    async function cargarCitar() {
      trabajando('Leyendo las pestañas de citaciones…');
      try {
        estado = await servidor('estadoCitar');
        pintarCitar();
      } catch (err) {
        fallo(err);
      }
    }

    function pintarCitar() {
      const zonas = ORDEN_ZONAS.filter(z => estado.zonas[z]);
      const pestanas = estado.pestanas.map(p => {
        if (p.error) {
          return `<section class="pestana"><h2>${esc(p.nombre)}</h2><p class="error">${esc(p.error)}</p></section>`;
        }
        const botones = zonas.map(z => {
          const n = p.porZona[z] || 0;
          return `<button type="button" class="zona" data-citar="${esc(z)}" data-pestana="${esc(p.nombre)}" ${n ? '' : 'disabled'}>
            <span class="n">${fmt(n)}</span><b>✉️ ${esc(z)}</b><small>→ ${esc(estado.zonas[z])}</small></button>`;
        }).join('');
        return `<section class="pestana">
          <h2>${esc(p.nombre)}</h2>
          <div class="zonas">
            ${botones}
            <button type="button" class="zona" data-citar="" data-pestana="${esc(p.nombre)}" ${p.total ? '' : 'disabled'}>
              <span class="n">${fmt(p.total)}</span><b>✉️ Todas las zonas</b><small>lo que esté listo</small></button>
          </div>
          <p class="meta">${fmt(p.enviadas)} ya enviadas${p.sinZona ? ` · <span class="alerta">${fmt(p.sinZona)} con zona vacía o no reconocida (no se mandan)</span>` : ''}</p>
          <div class="acciones">
            <button type="button" class="peligro" data-eliminar="${esc(p.nombre)}" data-n="${p.enviadas}" ${p.enviadas ? '' : 'disabled'}>🗑️ Eliminar filas ENVIADO (${fmt(p.enviadas)})</button>
          </div>
        </section>`;
      }).join('');

      mostrar(`<p class="quien">Citás como <b>${esc(estado.cita)}</b> · Mails que te quedan hoy: <b>${fmt(estado.cupo)}</b></p>
        ${pestanas || '<p class="cargando">No hay pestañas "Citaciones…" en la planilla.</p>'}`);
    }

    async function vistaPrevia(pestana, zona) {
      trabajando('Armando la vista previa…');
      try {
        const v = await servidor('vistaPreviaCitar', pestana, zona);
        if (!v.total) {
          mostrar(`<div class="caja"><h2>${esc(v.titulo)}</h2>
            <p>No hay citaciones pendientes en "${esc(v.pestana)}".</p>
            ${avisoSinZona(v)}
            <div class="acciones"><button type="button" data-volver>Volver</button></div></div>`);
          return;
        }
        const resumen = Object.keys(v.resumen).map(k => `<li>${esc(k)}: <b>${fmt(v.resumen[k])}</b></li>`).join('');
        const filas = v.filas.map(f => `<tr><td>${f.fila}</td><td>${esc(f.nombre)}</td><td>${esc(f.puesto)}</td>
          <td>${esc(f.fecha)}</td><td>${esc(f.hora)}</td><td>${esc(f.sede)}</td></tr>`).join('');
        const sinCupo = v.total > v.cupo
          ? `<p class="aviso">⚠️ Querés mandar ${fmt(v.total)} y te quedan ${fmt(v.cupo)} mails hoy: los que no entren quedan con ERROR.</p>`
          : '';
        mostrar(`<div class="caja">
          <h2>${esc(v.titulo)}</h2>
          <p>Pestaña: <b>${esc(v.pestana)}</b> · Cita: <b>${esc(v.cita)}</b></p>
          <ul>${resumen}</ul>
          <p>Total a enviar: <b>${fmt(v.total)}</b> · Mails que te quedan hoy: <b>${fmt(v.cupo)}</b></p>
          ${sinCupo}
          ${avisoSinZona(v)}
          <div class="tabla"><table>
            <thead><tr><th>Fila</th><th>Nombre</th><th>Puesto</th><th>Fecha</th><th>Hora</th><th>Sede</th></tr></thead>
            <tbody>${filas}</tbody>
          </table></div>
          <div class="acciones">
            <button type="button" class="principal" data-enviar>✉️ Enviar ${fmt(v.total)} citaciones</button>
            <button type="button" data-volver>Cancelar</button>
          </div>
        </div>`);
        $app.querySelector('[data-enviar]').addEventListener('click', () => enviar(v));
      } catch (err) {
        fallo(err);
      }
    }

    function avisoSinZona(v) {
      if (!v.sinZona.length) return '';
      const filas = v.sinZona.slice(0, 15).join(', ') + (v.sinZona.length > 15 ? '…' : '');
      return `<p class="aviso">⚠️ ${fmt(v.sinZona.length)} fila(s) con zona vacía o no reconocida (usar CABA, Norte, Sur u Oeste). No se envían. Filas: ${esc(filas)}</p>`;
    }

    async function enviar(v) {
      trabajando(`Enviando ${fmt(v.total)} citaciones… No cierres esta ventana.`);
      try {
        const r = await servidor('citar', v.pestana, v.zona, v.claves);
        mostrar(`<div class="caja"><h2>Proceso terminado</h2>
          <p class="${r.errores ? 'error' : 'ok'}">Citaciones enviadas: ${fmt(r.enviados)} · Errores: ${fmt(r.errores)}</p>
          ${r.salteados ? `<p>No enviadas (ya las envió otra persona o cambiaron): ${fmt(r.salteados)}</p>` : ''}
          <div class="acciones"><button type="button" data-volver>Volver</button></div></div>`);
      } catch (err) {
        fallo(err);
      }
    }

    function confirmarEliminar(pestana, n) {
      mostrar(`<div class="caja"><h2>Eliminar filas enviadas</h2>
        <p>¿Borrar las <b>${fmt(n)}</b> filas "ENVIADO" de la pestaña "${esc(pestana)}"?</p>
        <p class="aviso">Se eliminan las filas completas.</p>
        <div class="acciones">
          <button type="button" class="principal" data-si>Sí, borrar</button>
          <button type="button" data-volver>Cancelar</button>
        </div></div>`);
      $app.querySelector('[data-si]').addEventListener('click', async () => {
        trabajando('Borrando filas…');
        try {
          const r = await servidor('eliminarEnviadas', pestana);
          mostrar(`<div class="caja"><h2>Limpieza finalizada</h2>
            <p class="ok">Se eliminaron ${fmt(r.eliminadas)} fila(s) con estado ENVIADO de "${esc(r.pestana)}".</p>
            <div class="acciones"><button type="button" data-volver>Volver</button></div></div>`);
        } catch (err) {
          fallo(err);
        }
      });
    }

    /* ---------- 📋 Confirmados ---------- */

    async function cargarConfirmados() {
      trabajando('Leyendo la hoja Confirmados…');
      try {
        estado = await servidor('estadoConfirmados');
        pintarConfirmados();
      } catch (err) {
        fallo(err);
      }
    }

    function pintarConfirmados() {
      mostrar(`<p class="quien">Tu casilla: <b>${esc(estado.casilla)}</b> · "${esc(estado.hoja)}" tiene <b>${fmt(estado.filas)}</b> confirmados</p>
        <button type="button" class="grande" data-recopilar><b>📋 Recopilar confirmados</b>
          <small>Lee los "Confirmo" de tu casilla (últimos ${fmt(estado.diasAtras)} días) y los suma a ${esc(estado.hoja)}, sin duplicar.</small></button>
        <button type="button" class="grande" data-gmail><b>📩 Organizar confirmaciones en Gmail</b>
          <small>Etiqueta por sede (Citaciones/Florida, Adrogué, Merlo) y archiva.</small></button>
        <p class="meta">La recopilación automática se activa desde el menú 📞 Citar de la planilla.</p>`);
    }

    async function recopilar() {
      trabajando('Recopilando confirmados de tu casilla…');
      try {
        const r = await servidor('recopilar');
        const detalle = Object.keys(r.porSede).map(s => `<li>${esc(s)}: <b>${fmt(r.porSede[s])}</b></li>`).join('');
        mostrar(`<div class="caja"><h2>Recopilación finalizada</h2>
          <p>Casilla leída: <b>${esc(r.casilla)}</b></p>
          <p>Mails de confirmación leídos: <b>${fmt(r.leidos)}</b></p>
          <p class="ok">Nuevos confirmados: ${fmt(r.nuevos)}</p>
          ${detalle ? `<ul>${detalle}</ul>` : ''}
          <p>Sin fecha u hora (S/D): <b>${fmt(r.sinDato)}</b></p>
          <p class="meta">Listado en "${esc(r.planilla)}", hoja "${esc(r.hoja)}".</p>
          <div class="acciones"><button type="button" data-volver>Volver</button></div></div>`);
      } catch (err) {
        fallo(err);
      }
    }

    async function organizar() {
      trabajando('Organizando tu Gmail…');
      try {
        const r = await servidor('organizarGmail');
        const detalle = Object.keys(r.porSede).map(s => `<li>${esc(s)}: <b>${fmt(r.porSede[s])}</b></li>`).join('');
        mostrar(`<div class="caja"><h2>Organización finalizada</h2>
          ${r.total
            ? `<p class="ok">Se etiquetaron y archivaron ${fmt(r.total)} hilo(s):</p><ul>${detalle}</ul>`
            : '<p>No se encontraron correos de confirmación nuevos en Recibidos.</p>'}
          <div class="acciones"><button type="button" data-volver>Volver</button></div></div>`);
      } catch (err) {
        fallo(err);
      }
    }

    /* ---------- Clics ---------- */

    $app.addEventListener('click', ev => {
      const b = ev.target.closest('button');
      if (!b || b.disabled) return;
      if (b.hasAttribute('data-volver')) { VISTA === 'confirmados' ? cargarConfirmados() : cargarCitar(); return; }
      if (b.hasAttribute('data-citar')) { vistaPrevia(b.dataset.pestana, b.dataset.citar); return; }
      if (b.hasAttribute('data-eliminar')) { confirmarEliminar(b.dataset.eliminar, Number(b.dataset.n)); return; }
      if (b.hasAttribute('data-recopilar')) { recopilar(); return; }
      if (b.hasAttribute('data-gmail')) { organizar(); }
    });

    if (VISTA === 'confirmados') cargarConfirmados();
    else cargarCitar();
  </script>
</body>
</html>
